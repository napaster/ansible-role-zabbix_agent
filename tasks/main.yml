---
- ansible.builtin.import_tasks:
    file: "pre_requisite.yml"
- ansible.builtin.include_tasks:
    file: "packages.yml"
  when:
    - "hostvars[inventory_hostname]['zabbix_agent'] is defined"
    - "hostvars[inventory_hostname]['zabbix_agent'] != ''"
    - "hostvars[inventory_hostname]['zabbix_agent'] |
       community.general.json_query(vars['zabbix_agent_install_package']) is
       defined"
    - "hostvars[inventory_hostname]['zabbix_agent'] |
       community.general.json_query(vars['zabbix_agent_install_package']) ==
       'true'"
  vars:
    zabbix_agent_install_package:
      "[] | map(&install_package || 'false', @) | [0]"
- ansible.builtin.include_tasks:
    file: "packages.yml"
  when:
    - "hostvars[inventory_hostname]['zabbix_agent'] is defined"
    - "hostvars[inventory_hostname]['zabbix_agent'] != ''"
    - "hostvars[inventory_hostname]['zabbix_agent'] |
       community.general.json_query(vars['zabbix_agent_install_plugin']) is
       defined"
    - "hostvars[inventory_hostname]['zabbix_agent'] |
       community.general.json_query(vars['zabbix_agent_install_plugin']) ==
       'true'"
  vars:
    zabbix_agent_install_package:
      "[] | map(&install_package || 'false', @) | [0]"
- ansible.builtin.include_tasks:
    file: "plugin_packages.yml"
  when:
    - "hostvars[inventory_hostname]['zabbix_agent'] is defined"
    - "hostvars[inventory_hostname]['zabbix_agent'] != ''"
    - "hostvars[inventory_hostname]['zabbix_agent'] |
       community.general.json_query('[0].install_plugin') == 'true'"
- ansible.builtin.include_tasks:
    file: deploy_smartctl.yml
  when:
    - zabbix_agent_smartctl_enabled | default(false) | bool
- ansible.builtin.include_tasks:
    file: deploy_zfs.yml
  when:
    - zabbix_agent_zfs_enabled | default(false) | bool
- name: Include tasks for LSI RAID deployment
  ansible.builtin.include_tasks: deploy_lsiraid.yml
  when:
    - zabbix_agent_user_parameter_lsiraid is defined
    - zabbix_agent_user_parameter_lsiraid | length > 0
- ansible.builtin.include_tasks:
    file: "deploy_zabbix_psk.yml"
  when:
    - "hostvars[inventory_hostname]['zabbix_agent'] is defined"
    - "hostvars[inventory_hostname]['zabbix_agent'] != ''"
    - "hostvars[inventory_hostname]['zabbix_agent'] |
       community.general.json_query(vars['zabbix_agent_deploy_psk']) is defined"
    - "hostvars[inventory_hostname]['zabbix_agent'] |
       community.general.json_query(vars['zabbix_agent_deploy_psk']) == 'true'"
  vars:
    zabbix_agent_deploy_psk: "[] | map(&deploy_psk_file || 'false', @) | [0]"
- ansible.builtin.include_tasks:
    file: "deploy_zabbix_agent.yml"
  when:
    - "vars['zabbix_agent_settings'] is defined"
    - "vars['zabbix_agent_settings'] != []"
- ansible.builtin.include_tasks:
    file: "deploy_sudoers.yml"